name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Content gates
        run: ./gradlew :tools:compileMaps :tools:checkProgression :tools:validateContent :tools:buildAssetManifest
      - name: Generated content is committed
        run: git diff --exit-code -- assets/
      - name: Tests
        run: ./gradlew :engine:test :tools:test
      - name: Android APK and bundle
        run: ./gradlew :android:assembleDebug :android:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
